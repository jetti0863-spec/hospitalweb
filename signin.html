<!DOCTYPE html>
<!-- HTML5 Document -->

<html>

<head>

    <!-- Page Title -->
    <title>Sign In</title>

    <!-- External CSS File -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Header -->
    <div id="header"></div>

    <!-- Main Content -->
    <main>

        <!-- Sign In Form -->
       <form onsubmit="return login(event)">

            <!-- Page Heading -->
            <h2>Sign In</h2>

            <!-- Description -->
            <p>

                Login using your registered account.

            </p>

            <br>

            <!-- Email Address -->
            <label>

                Email Address

            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
                oninput="validateLoginEmail()">

            <span
                id="emailError"
                class="error">

            </span>

            <br><br>

            <!-- Password -->
            <label>

                Password

            </label>

            <input
                type="password"
                id="pwd"
                placeholder="Enter Password"
                required
                oninput="validateLoginPassword()">

            <span
                id="pwdError"
                class="error">

            </span>

            <br><br>

            <!-- Buttons -->
            <button type="submit">

                Sign In

            </button>

            <button type="reset">

                Reset

            </button>

            <br><br>

            <!-- Create Account Link -->
            <p>

                Don't have an account?

                <a href="signup.html">

                    Create Account

                </a>

            </p>

            <br>

            <!-- Back Button -->
            <button
                type="button"
                onclick="history.back()">

                ← Back

            </button>

        </form>

    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Load Header and Footer -->
    <script src="js/loadComponents.js"></script>

    <!-- Sign In JavaScript -->
    <script src="js/signin.js"></script>

</body>

</html>
